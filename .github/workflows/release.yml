name: Release

# Push a tag like v1.0.0 to build every installer and publish a GitHub Release.
# The tag must match pixelpals.version in gradle.properties.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches gradle.properties
        run: |
          version=$(grep '^pixelpals.version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pixelpals.version=$version"
            exit 1
          fi

  android:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          ./gradlew :androidApp:assembleRelease
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk dist/PixelPals-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*

  desktop:
    needs: check-version
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            task: packageDeb
            src: desktopApp/build/compose/binaries/main/deb/*.deb
            out: PixelPals-linux.deb
          - os: macos-latest
            task: packageDmg
            src: desktopApp/build/compose/binaries/main/dmg/*.dmg
            out: PixelPals-macos-apple-silicon.dmg
          - os: macos-15-intel
            task: packageDmg
            src: desktopApp/build/compose/binaries/main/dmg/*.dmg
            out: PixelPals-macos-intel.dmg
          - os: windows-latest
            task: packageMsi
            src: desktopApp/build/compose/binaries/main/msi/*.msi
            out: PixelPals-windows.msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :desktopApp:${{ matrix.task }}
      - run: |
          mkdir -p dist
          cp ${{ matrix.src }} dist/${{ matrix.out }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*

  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Downloads

          | Platform | File |
          |---|---|
          | Android 8.0+ | `PixelPals-android.apk` |
          | Windows | `PixelPals-windows.msi` |
          | macOS (Apple Silicon) | `PixelPals-macos-apple-silicon.dmg` |
          | macOS (Intel) | `PixelPals-macos-intel.dmg` |
          | Linux (Debian/Ubuntu) | `PixelPals-linux.deb` |

          **Android:** open the APK on the device and allow installing from your browser or file manager when asked.

          **Windows:** the installer isn't code-signed yet, so SmartScreen may warn you. Choose "More info", then "Run anyway".

          **macOS:** the app isn't notarized yet. After dragging it to Applications, right-click it and choose "Open" the first time. If macOS says it's damaged, run `xattr -cr "/Applications/PixelPals.app"` in Terminal.

          **Linux:** `sudo apt install ./PixelPals-linux.deb`

          `SHA256SUMS.txt` lists checksums for every file.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Pixel Pals ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --generate-notes
